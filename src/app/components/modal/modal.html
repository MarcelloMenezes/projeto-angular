<h2 mat-dialog-title>Adicionar conteúdo</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <div class="card-form">
      <mat-form-field class="campo-form-field">
        <mat-label>Data aula</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="data" />
        <mat-hint>MM/DD/YYYY</mat-hint>
        <mat-datepicker-toggle
          matIconSuffix
          [for]="picker"
        ></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
      <mat-form-field class="campo-form-field">
        <mat-label>Nome professor (a)</mat-label>
        <input
          type="text"
          matInput
          formControlName="nome"
        />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Eixo</mat-label>
        <select matNativeControl formControlName="eixo">
          <option value="" selected>Selecione o eixo</option>
          <option value="movimento">Movimento</option>
          <option value="artes">Artes</option>
        </select>
      </mat-form-field>
    </div>
    <div>
      <div>
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Objetivo</mat-label>
          <textarea
            type="text"
            matInput
            placeholder="Digite aqui o objetivo da aula"
            formControlName="objetivo"
          ></textarea>
        </mat-form-field>
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton mat-dialog-close>Cancelar</button>
  <button matButton cdkFocusInitial (click)="salvar()">Salvar</button>
</mat-dialog-actions>
