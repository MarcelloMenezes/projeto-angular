<table
  *ngIf="dataSource?.data"
  mat-table
  [dataSource]="dataSource"
  class="mat-elevation-z8"
>

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let element">{{ element.id }}</td>
  </ng-container>

  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Data da aula</th>
    <td mat-cell *matCellDef="let element">
      {{ element.data_aula | date : "dd/MM/yyyy" }}
    </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nome da professor (a)</th>
    <td mat-cell *matCellDef="let element">{{ element.nome_professor }}</td>
  </ng-container>

  <ng-container matColumnDef="objetivo">
    <th mat-header-cell *matHeaderCellDef>Objetivo</th>
    <td mat-cell *matCellDef="let element">{{ element.objetivo }}</td>
  </ng-container>

  <ng-container matColumnDef="eixo">
    <th mat-header-cell *matHeaderCellDef>Eixo</th>
    <td mat-cell *matCellDef="let element">{{ element.eixo }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
