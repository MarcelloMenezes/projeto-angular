<table
  *ngIf="dataSource?.data"
  mat-table
  [dataSource]="dataSource"
  class="mat-elevation-z8"
>
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let element">{{ element.id }}</td>
  </ng-container>

  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Data da aula</th>
    <td mat-cell *matCellDef="let element">
      {{ element.data_aula | date : "dd/MM/yyyy" }}
    </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nome da professor (a)</th>
    <td mat-cell *matCellDef="let element">{{ element.nome_professor }}</td>
  </ng-container>

  <ng-container matColumnDef="objetivo">
    <th mat-header-cell *matHeaderCellDef>Objetivo</th>
    <td mat-cell *matCellDef="let element">{{ element.objetivo }}</td>
  </ng-container>

  <ng-container matColumnDef="eixo">
    <th mat-header-cell *matHeaderCellDef>Eixo</th>
    <td mat-cell *matCellDef="let element">{{ element.eixo }}</td>
  </ng-container>

  <ng-container matColumnDef="acoes">
    <th mat-header-cell *matHeaderCellDef>Ações</th>
    <td mat-cell *matCellDef="let element">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        class="icon"
        style="margin-right: 20px"
        #tooltip="matTooltip"
        matTooltip="Editar conteúdo"
        matTooltipPosition="above"
        (click)="editar(element)"
      >
        <path
          fill="currentColor"
          d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83l3.75 3.75z"
        />
      </svg>

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        class="icon"
        #tooltip="matTooltip"
        matTooltip="Deletar conteúdo"
        matTooltipPosition="above"
      >
        <path
          fill="currentColor"
          d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"
        />
      </svg>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
